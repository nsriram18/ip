plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'com.gradleup.shadow' version '9.5.1'
}

checkstyle {
    toolVersion = '11.0.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

dependencies {
    String javaFxVersion = '17.0.7'
    String osName = System.getProperty('os.name').toLowerCase()
    String architecture = System.getProperty('os.arch').toLowerCase()
    String javaFxPlatform
    if (osName.contains('mac')) {
        javaFxPlatform = architecture.contains('aarch64') || architecture.contains('arm64')
                ? 'mac-aarch64' : 'mac'
    } else if (osName.contains('win')) {
        javaFxPlatform = 'win'
    } else if (osName.contains('linux')) {
        javaFxPlatform = architecture.contains('aarch64') || architecture.contains('arm64')
                ? 'linux-aarch64' : 'linux'
    } else {
        throw new GradleException("Unsupported JavaFX platform: ${osName} ${architecture}")
    }

    ['base', 'controls', 'fxml', 'graphics'].each { moduleName ->
        implementation("org.openjfx:javafx-${moduleName}:${javaFxVersion}:${javaFxPlatform}")
    }

    String jUnitVersion = '5.14.4'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-params:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

test {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'

        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }
}

application {
    mainClass = 'ramly.gui.Launcher'
}

jar {
    // A lean JAR file (i.e., without the dependencies packaged inside) is not needed.
    enabled = false
    // Rename its output anyway; Gradle forbids it clashing with the shadowJar output file, even for a disabled task.
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    archiveFileName = 'pip.jar'
    manifest {
        attributes 'Main-Class': 'ramly.gui.Launcher'
    }
}

run {
    standardInput = System.in
}
